# Démarre deux fois par heure (GitHub décale souvent ces horaires). Pendant une fenêtre de validation
# (45 min avant chaque recherche → 2 h 35 après chaque publication, heure de Paris), le passage reste
# allumé et applique tes clics Telegram en quelques secondes ; en dehors, il fait un passage et s'arrête.
# Les démarrages pendant une surveillance attendent leur tour (concurrency). Dépôt public : minutes illimitées.
# L'état (data/) est enregistré dans le dépôt au fil de l'eau et à la fin.
name: Planning fr_checkpoint

on:
  schedule:
    - cron: "15,45 7-21 * * *"
  workflow_dispatch:

concurrency:
  group: planning
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Passage du planificateur
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          MEDIAS_TOKEN: ${{ secrets.MEDIAS_TOKEN }}
          MEDIAS_DEPOT: ${{ secrets.MEDIAS_DEPOT }}
        run: python -W ignore run_all.py

      - name: Enregistrement de l'état
        if: always()
        run: |
          git config user.name "checkpoint-bot"
          git config user.email "checkpoint-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -q -m "état $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase origin main && git push -q origin HEAD:main
