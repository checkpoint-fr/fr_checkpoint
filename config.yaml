# Configuration de @fr_checkpoint — veille jeux vidéo publiée sur Instagram.
# Les clés API sont dans .env (jamais ici).

compte:
  nom: "@fr_checkpoint"
  langue_publication: fr

veille:
  fenetre_heures: 36        # on ignore les articles publiés avant
  conservation_jours: 7     # fichiers data/veille/ plus anciens supprimés
  resume_max: 400           # caractères gardés du chapô (jamais l'article entier)
  # type : presse | officiel | communaute (sert au tri : une info officielle pèse plus)
  sources:
    # Presse française
    - { nom: "JV",                url: "https://www.jeuxvideo.com/rss/rss.xml",                    langue: fr, type: presse }
    - { nom: "Gamekult",          url: "https://www.gamekult.com/feed.xml",                        langue: fr, type: presse }
    - { nom: "Gameblog",          url: "https://www.gameblog.fr/rss.php",                          langue: fr, type: presse }
    - { nom: "ActuGaming",        url: "https://www.actugaming.net/feed/",                         langue: fr, type: presse }
    - { nom: "Journal du Geek",   url: "https://www.journaldugeek.com/category/jeux-video/feed/",  langue: fr, type: presse }
    # Presse internationale (souvent la première à sortir l'info)
    - { nom: "IGN",               url: "https://feeds.feedburner.com/ign/all",                     langue: en, type: presse }
    - { nom: "PC Gamer",          url: "https://www.pcgamer.com/rss/",                             langue: en, type: presse }
    - { nom: "Eurogamer",         url: "https://www.eurogamer.net/feed",                           langue: en, type: presse }
    - { nom: "GamesRadar",        url: "https://www.gamesradar.com/rss/",                          langue: en, type: presse }
    - { nom: "Rock Paper Shotgun", url: "https://www.rockpapershotgun.com/feed",                   langue: en, type: presse }
    - { nom: "VGC",               url: "https://www.videogameschronicle.com/feed/",                langue: en, type: presse }
    - { nom: "Polygon",           url: "https://www.polygon.com/rss/index.xml",                    langue: en, type: presse }
    # Annonces officielles
    - { nom: "PlayStation Blog",  url: "https://blog.playstation.com/feed/",                       langue: en, type: officiel }
    - { nom: "Xbox Wire",         url: "https://news.xbox.com/en-us/feed/",                        langue: en, type: officiel }
    # Communauté (ce dont les joueurs parlent le plus aujourd'hui)
    - { nom: "Reddit r/Games",    url: "https://www.reddit.com/r/Games/top/.rss?t=day",            langue: en, type: communaute }

tri:
  fenetre_heures: 24        # articles pris en compte
  nb_sujets: 5              # sujets proposés à chaque passage
  min_sources: 2            # un sujet repris par une seule source est ignoré (sauf top Reddit)
  seuil_regroupement: 0.14  # 0 à 1 : plus haut = groupes plus stricts
  demi_vie_heures: 12       # un sujet perd la moitié de son score toutes les 12 h
  memoire_jours: 3          # un sujet déjà proposé n'est pas reproposé pendant 3 jours
  poids:
    par_source: 1.0         # chaque média qui en parle
    officiel: 1.5           # annonce PlayStation / Xbox
    communaute: 1.0         # présent dans le top Reddit du jour
    fr_et_en: 0.5           # repris en France ET à l'international
  # Articles écartés (titres en minuscules sans accents) : guides, solutions, promos.
  # Les promos pourront servir plus tard à l'affiliation.
  exclusions:
    - '\bguides?\b'
    - '\bsoluce\b'
    - '\bastuces?\b'
    - '\bhow to\b'
    - '\bwhere to\b'
    - '\bbest places\b'
    - '\bwhat time\b'
    - '\bque faire\b'
    - '\bcomment (trouver|obtenir|debloquer|battre|reussir|faire)\b'
    - '\bwordle\b'
    - '\bquiz\b'
    - '\bdrops? to\b'
    - '\bbest .*deals?\b'
    - '\bdeals? (on|for)\b'
    - '\b(promo|promotion|bon plan|soldes)\b'
  # Abréviations ramenées à une seule forme pour reconnaître le même jeu en FR et en EN.
  alias:
    "grand theft auto": "gta"
    "gta vi": "gta 6"
    "call of duty": "cod"
    "modern warfare 4": "mw4"
    "mw 4": "mw4"
    "the legend of zelda": "zelda"
    "kingdom come deliverance": "kcd"
    "playstation 5": "ps5"

llm:
  # Gemini gratuit : https://aistudio.google.com/apikey (les données du niveau gratuit
  # peuvent servir à Google pour améliorer ses modèles : ne rien envoyer de personnel).
  fournisseurs: [gemini, gemini_leger, groq]
  modele_gemini: gemini-3.8-flash
  modele_gemini_leger: gemini-3.5-flash-lite
  modele_groq: openai/gpt-oss-120b
  temperature_redaction: 0.6

redaction:
  articles_lus: 3           # articles ouverts par sujet pour donner des faits à l'IA
  extrait_max: 2500         # caractères lus par article (servent à l'IA, jamais publiés)
  hashtags_fixes: ["#checkpointfr", "#jeuxvideo", "#gaming"]
  uniformiser:              # [motif, remplacement] appliqués à tous les textes (la voix dit « GTA 6 »)
    - ['\bGrand Theft Auto\s+(VI|6)\b', 'GTA VI']
    - ['\bGTA\s*(VI|6)\b', 'GTA VI']
  limites:                  # caractères max par zone des images (cf. agents/prompts/redacteur.md)
    accroche: 70
    sous_titre: 110
    point_titre: 40
    point_texte: 180
    a_retenir: 120

visuel:
  largeur: 1080             # format portrait 4:5 recommandé par Instagram
  hauteur: 1350
  qualite_jpeg: 92          # l'API Instagram n'accepte que le JPEG
  couleurs:
    fond: "#0D0F14"
    carte: "#161A23"
    accent: "#4D8DFF"
    texte: "#F4F6FA"
    secondaire: "#9AA3B5"
  polices:                  # Archivo, licence libre OFL (assets/polices/OFL.txt)
    titre: assets/polices/ArchivoBlack-Regular.ttf
    texte: assets/polices/Archivo-Variable.ttf
  appel:                    # dernière image du carrousel
    titre: "Cette actu t'a plu ?"
    actions:                # dans l'ordre : j'aime, commentaire, partage, enregistrement
      - "Like pour soutenir le compte"
      - "Donne ton avis en commentaire"
      - "Partage-la à un pote joueur"
      - "Enregistre-la pour la retrouver"
    suivre: "Suis"
    sous_titre: "L'actu jeu vidéo, chaque jour"
  statuts:                  # pastille de la 1re image
    officiel: "OFFICIEL"
    confirme: "CONFIRMÉ"
    rumeur: "RUMEUR"

validation:
  expiration_heures: 24     # sans réponse après 24 h, le brouillon est abandonné (l'info est périmée)

publication:
  hote_api: graph.facebook.com   # jeton « utilisateur système » de la connexion unifiée Meta
  version_api: v27.0
  heures_publication: [8, 23]   # heure de Paris : rien n'est publié la nuit
  ecart_minutes: 90             # au moins 1 h 30 entre deux posts (mieux pour la portée)
  max_par_passage: 1            # un post par passage, les suivants attendent leur tour
  fraicheur_heures: 24          # validé il y a plus de 24 h : l'info est périmée, on abandonne
  essais_max: 3                 # après 3 échecs, le carrousel passe en « echec »

planning:
  # Trois posts par jour. Chaque créneau : recherche (veille → tri → rédaction → images → Telegram),
  # puis publication à l'heure dite du meilleur carrousel que tu as validé (un seul par créneau).
  debut: "2026-11-14"
  tolerance_minutes: 150      # validé en retard : publié au plus tard 2 h 30 après l'heure prévue
  creneaux:
    actu:
      libelle: "Actu jeu vidéo"
      recherche: "10:30"
      publication: "12:30"
      nb_sujets: 3            # 3 propositions sur Telegram, la mieux classée parmi tes ✅ est publiée
      exclure: ['\bgta ?(6|vi)\b', 'grand theft auto (6|vi)\b', '\bvice city\b']
    gta6:
      libelle: "GTA 6"
      recherche: "18:00"
      publication: "19:30"
      nb_sujets: 3
      min_sources: 1          # une annonce de Rockstar seule suffit
      inclure: ['\bgta ?(6|vi)\b', 'grand theft auto (6|vi)\b', '\bvice city\b']
    actu_soir:
      libelle: "Actu du soir"
      recherche: "19:45"      # récupère les annonces de l'après-midi américain (événements, trailers…)
      publication: "21:00"
      nb_sujets: 3
      exclure: ['\bgta ?(6|vi)\b', 'grand theft auto (6|vi)\b', '\bvice city\b']

format: reel                  # « reel » (vidéo verticale) ou « carrousel » (images)
carrousel_les: ["2026-11-14"]  # jours où l'on publie quand même en carrousel

reel:
  largeur: 1080
  hauteur: 1920
  fps: 30
  voix:
    modeles: [gemini-3.8-flash-tts, gemini-3.8-flash-lite-tts]
    nom: Charon               # voix Gemini (Charon, Puck, Fenrir, Kore, Aoede…) ; le texte est lu tel quel
    appel: "Abonne-toi à F R Checkpoint pour ne rater aucune actu jeu vidéo !"
  # Noms anglais que la voix française prononce mal (lettre finale avalée) : réécrits pour la voix
  # seulement, les sous-titres gardent la vraie orthographe. Le rédacteur ajoute aussi les siens.
  prononciation:
    Checkpoint: "Tchèk-poïnnte"
    "F R": "èf èr"
    "GTA VI": "GTA 6"         # écrit « GTA VI », dit « GTA six »
  fin_secondes: 2.5          # l'écran « Suis @fr_checkpoint » reste affiché 2,5 s après la dernière phrase
  transcription: whisper-large-v3-turbo   # Groq : heure de chaque mot prononcé, pour caler les sous-titres
  musique:
    dossier: assets/musique   # dépose ici des .mp3 libres de droits : un morceau tiré au hasard par vidéo
    volume: 0.10
